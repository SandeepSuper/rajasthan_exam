version: '3.8'

services:

  postgres:
    image: postgres:16-alpine
    container_name: rajasthan_postgres
    restart: always

    ports:
      - "127.0.0.1:5432:5432"   # 🔒 secure (no public access)

    environment:
      POSTGRES_DB: ${POSTGRES_PROD_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - app_network


  redis:
    image: redis:7-alpine
    container_name: rajasthan_redis
    restart: always

    ports:
      - "127.0.0.1:6379:6379"   # 🔒 secure

    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}

    volumes:
      - redis_data:/data

    networks:
      - app_network


volumes:
  postgres_data:
  redis_data:


networks:
  app_network:
    driver: bridge