<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Notifications | Rajasthan Exams</title>
    <script src="/admin-auth.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary: #1a237e;
            --sidebar-width: 240px;
        }

        body {
            background: #f0f2f5;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: linear-gradient(180deg, #1a237e 0%, #283593 100%);
            min-height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            box-shadow: 2px 0 8px rgba(0, 0, 0, .15);
            z-index: 100;
        }

        .sidebar-brand {
            padding: 20px 24px;
            background: rgba(0, 0, 0, .2);
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ffd700;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .sidebar-nav {
            padding: 16px 0;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 24px;
            color: rgba(255, 255, 255, .75);
            text-decoration: none;
            transition: all .2s;
            font-size: .93rem;
        }

        .sidebar-link:hover,
        .sidebar-link.active {
            background: rgba(255, 255, 255, .15);
            color: #fff;
        }

        .sidebar-link.active {
            border-left: 3px solid #ffd700;
        }

        .sidebar-link i {
            font-size: 1.1rem;
            width: 20px;
        }

        .main {
            margin-left: var(--sidebar-width);
            padding: 32px;
        }

        .page-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a237e;
            margin: 0;
        }

        .page-subtitle {
            font-size: .85rem;
            color: #6c757d;
        }

        .card {
            border: none;
            border-radius: 14px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, .08);
        }

        .card-header {
            background: #fff;
            border-bottom: 1px solid #f0f0f0;
            border-radius: 14px 14px 0 0 !important;
            padding: 16px 20px;
        }

        .form-control,
        .form-select {
            border: 1.5px solid #dee2e6;
            border-radius: 8px;
            font-size: .88rem;
            padding: 8px 12px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #3949ab;
            box-shadow: 0 0 0 3px rgba(57, 73, 171, .1);
        }

        .notif-card {
            background: #fff;
            border-radius: 12px;
            padding: 18px 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .06);
            margin-bottom: 14px;
            border: 1.5px solid #e9ecef;
            transition: border-color .2s;
        }

        .notif-card:hover {
            border-color: #c5cae9;
        }

        .notif-title {
            font-weight: 700;
            font-size: 1.05rem;
            color: #1a237e;
            margin-bottom: 3px;
        }

        .notif-date {
            font-size: .78rem;
            color: #6c757d;
            margin-bottom: 8px;
        }

        .notif-desc {
            font-size: .95rem;
            color: #495057;
            white-space: pre-wrap;
        }

        .btn-delete {
            color: #dc3545;
            background: #fff0f0;
            border: none;
            border-radius: 8px;
            padding: 5px 12px;
            font-size: .8rem;
        }

        .btn-delete:hover {
            background: #dc3545;
            color: #fff;
        }

        .toast-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 9999;
        }

        #notif-list .spinner-wrap {
            display: flex;
            justify-content: center;
            padding: 40px;
        }

        .icon-preview {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .icon-info {
            background: #e3f2fd;
            color: #1976d2;
        }

        .icon-success {
            background: #e8f5e9;
            color: #388e3c;
        }

        .icon-warning {
            background: #fff3e0;
            color: #f57c00;
        }

        .icon-error {
            background: #ffebee;
            color: #d32f2f;
        }

        .icon-gift {
            background: #f3e5f5;
            color: #7b1fa2;
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-brand"><i class="bi bi-mortarboard-fill"></i> Rajasthan Exams</div>
        <nav class="sidebar-nav">
            <a href="/admin" class="sidebar-link"><i class="bi bi-grid"></i> Dashboard</a>
            <a href="/admin/tests" class="sidebar-link"><i class="bi bi-clipboard-check"></i> Create Test</a>
            <a href="/admin/content" class="sidebar-link"><i class="bi bi-collection"></i> Content</a>
            <a href="/admin/news" class="sidebar-link"><i class="bi bi-newspaper"></i> Current Affairs</a>
            <a href="/admin/notifications" class="sidebar-link active"><i class="bi bi-bell"></i> Notifications</a>
            <a href="/admin/payments" class="sidebar-link"><i class="bi bi-credit-card"></i> Payments</a>
            <a href="/admin/reports" class="sidebar-link"><i class="bi bi-bug"></i> Bug Reports</a>
            <div style="height:1px;background:rgba(255,255,255,.1);margin:12px 20px;"></div>
            <a href="/swagger-ui.html" class="sidebar-link" target="_blank"><i class="bi bi-code-slash"></i> API
                Docs</a>
            <a href="#" class="sidebar-link" style="color:#ff8a80;" onclick="adminLogout()"><i
                    class="bi bi-box-arrow-right"></i> Logout</a>
        </nav>
    </div>

    <!-- Main -->
    <div class="main">
        <div class="d-flex align-items-center justify-content-between mb-4">
            <div>
                <h1 class="page-title"><i class="bi bi-bell me-2"></i>Notifications</h1>
                <div class="page-subtitle">Publish alerts and announcements directly to the app</div>
            </div>
        </div>

        <div class="row g-4">
            <!-- Form Panel -->
            <div class="col-12 col-xl-4">
                <div class="card">
                    <div class="card-header d-flex align-items-center gap-2">
                        <i class="bi bi-send text-primary"></i>
                        <strong>Send Notification</strong>
                    </div>
                    <div class="card-body p-3">
                        <form id="notif-form">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Icon Type</label>
                                <select id="iconType" class="form-select">
                                    <option value="info">ℹ️ Info (Blue)</option>
                                    <option value="success">✅ Success (Green)</option>
                                    <option value="warning">⚠️ Warning (Orange)</option>
                                    <option value="error">🚨 Error (Red)</option>
                                    <option value="gift">🎁 Gift/Offer (Purple)</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Title <span class="text-danger">*</span></label>
                                <input type="text" id="notifTitle" class="form-control" placeholder="Notification Title"
                                    required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Message <span class="text-danger">*</span></label>
                                <textarea id="notifMessage" class="form-control" rows="4"
                                    placeholder="Type the message here..." required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100" id="submit-btn">
                                <i class="bi bi-bell-fill me-1"></i> Send to App
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Notification List -->
            <div class="col-12 col-xl-8">
                <div class="card">
                    <div class="card-header d-flex align-items-center justify-content-between">
                        <div class="d-flex align-items-center gap-2">
                            <i class="bi bi-list-ul text-primary"></i>
                            <strong>Sent Notifications</strong>
                            <span class="badge bg-secondary" id="notif-count">0</span>
                        </div>
                        <button class="btn btn-outline-secondary btn-sm" onclick="loadNotifications()">
                            <i class="bi bi-arrow-clockwise"></i> Refresh
                        </button>
                    </div>
                    <div class="card-body p-3">
                        <div id="notif-list">
                            <div class="spinner-wrap">
                                <div class="spinner-border text-primary"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-container">
        <div id="main-toast" class="toast align-items-center text-white border-0" role="alert" data-bs-autohide="true"
            data-bs-delay="3500">
            <div class="d-flex">
                <div class="toast-body fw-semibold" id="toast-msg">Done!</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API = '/api/notifications';

        window.onload = () => loadNotifications();

        const iconsMap = {
            info: '<i class="bi bi-info-circle fs-5"></i>',
            success: '<i class="bi bi-check-circle fs-5"></i>',
            warning: '<i class="bi bi-exclamation-triangle fs-5"></i>',
            error: '<i class="bi bi-x-circle fs-5"></i>',
            gift: '<i class="bi bi-gift fs-5"></i>'
        };

        async function loadNotifications() {
            document.getElementById('notif-list').innerHTML = '<div class="spinner-wrap"><div class="spinner-border text-primary"></div></div>';
            try {
                const res = await fetch(API, { headers: { 'Authorization': `Bearer ${getAdminToken()}` } });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                document.getElementById('notif-count').textContent = data.length;
                renderNotifications(data);
            } catch (e) {
                document.getElementById('notif-list').innerHTML =
                    `<div class="text-danger text-center py-4"><i class="bi bi-exclamation-triangle fs-3"></i><div class="mt-2">Failed to load: ${e.message}</div></div>`;
            }
        }

        function renderNotifications(data) {
            if (data.length === 0) {
                document.getElementById('notif-list').innerHTML =
                    `<div class="text-center text-muted py-5"><i class="bi bi-bell-slash fs-2"></i><div class="mt-2">No notifications sent yet.</div></div>`;
                return;
            }

            const html = data.map(item => {
                const date = new Date(item.createdAt).toLocaleString();
                const iconHtml = iconsMap[item.iconType] || iconsMap.info;
                const iconCls = `icon-${item.iconType || 'info'}`;

                return `
            <div class="notif-card" id="notif-${item.id}">
                <div class="d-flex align-items-start">
                    <div class="icon-preview ${iconCls}">${iconHtml}</div>
                    <div style="flex:1; min-width:0;">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <div class="notif-title">${item.title}</div>
                                <div class="notif-date">${date}</div>
                            </div>
                            <button class="btn-delete flex-shrink-0" onclick="deleteNotification('${item.id}')">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                        <div class="notif-desc">${item.message}</div>
                    </div>
                </div>
            </div>`;
            }).join('');

            document.getElementById('notif-list').innerHTML = html;
        }

        document.getElementById('notif-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Sending...';

            const body = {
                title: document.getElementById('notifTitle').value.trim(),
                message: document.getElementById('notifMessage').value.trim(),
                iconType: document.getElementById('iconType').value
            };

            try {
                const res = await fetch(API, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${getAdminToken()}`
                    },
                    body: JSON.stringify(body)
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                showToast('✅ Notification sent to app!', 'success');
                document.getElementById('notif-form').reset();
                loadNotifications();
            } catch (err) {
                showToast(`❌ Failed: ${err.message}`, 'danger');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-bell-fill me-1"></i> Send to App';
            }
        });

        async function deleteNotification(id) {
            if (!confirm('Delete this notification?')) return;
            try {
                const res = await fetch(`${API}/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${getAdminToken()}` }
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                document.getElementById(`notif-${id}`)?.remove();
                const countEl = document.getElementById('notif-count');
                countEl.textContent = parseInt(countEl.textContent) - 1;
                showToast('🗑️ Deleted successfully', 'secondary');
            } catch (err) {
                showToast(`❌ Failed: ${err.message}`, 'danger');
            }
        }

        function showToast(msg, type = 'success') {
            const el = document.getElementById('main-toast');
            el.className = `toast align-items-center text-white border-0 bg-${type}`;
            document.getElementById('toast-msg').textContent = msg;
            new bootstrap.Toast(el).show();
        }
    </script>
</body>

</html>
