# Render Blueprint for the backend API.
# In Render: New + → Blueprint → pick this repo and the "render" branch.
# Values marked "sync: false" are secrets: Render asks for them once when
# the Blueprint is created. They are never stored in this file.
services:
  - type: web
    name: rajasthan-exam-api
    runtime: docker
    plan: free
    region: singapore
    branch: render
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/config
    envVars:
      # prod settings, with database/Redis taken from the env vars below (catalyst profile)
      - key: SPRING_PROFILES_ACTIVE
        value: prod,catalyst

      # Login tokens are signed with this. Render generates a random value.
      - key: JWT_SECRET
        generateValue: true

      # Neon PostgreSQL (JDBC URL: jdbc:postgresql://<host>/<db>?sslmode=require)
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

      # Upstash Redis
      - key: SPRING_DATA_REDIS_HOST
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: SPRING_DATA_REDIS_PORT
        value: "6379"
      - key: SPRING_DATA_REDIS_USERNAME
        value: default
      - key: SPRING_DATA_REDIS_SSL_ENABLED
        value: "true"
      - key: SPRING_DATA_REDIS_DATABASE
        value: "0"

      # Razorpay
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

      # Email OTP (ZeptoMail)
      - key: MAIL_TOKEN
        sync: false
      - key: MAIL_FROM
        sync: false

      # Admin panel login (do not leave the defaults)
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false

      # Public values
      - key: GOOGLE_CLIENT_ID
        value: 701768114705-l2fnicghvsq1tpehe2vu5qqdf6pmnlik.apps.googleusercontent.com
      - key: PLAY_STORE_URL
        value: https://play.google.com/store/apps/details?id=com.rajasthanexams
      - key: CORS_ALLOWED_ORIGINS
        value: https://rajasthan-exam-web.vercel.app
